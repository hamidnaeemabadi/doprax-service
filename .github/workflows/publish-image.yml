name: Publish container image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - VERSION
      - .dockerignore
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=v$version" >> "$GITHUB_OUTPUT"
      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: doprax-service:check
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check installed tools and startup
        run: |
          timeout 60 docker run --rm doprax-service:check bash -ec '
            for tool in curl wget ifconfig netstat nmap iftop mtr speedtest bash htop btop; do
              command -v "$tool"
            done
            test -s /usr/share/bash-completion/bash_completion
            test -s /root/.bashrc
            test -s /root/.config/my-shell/common.sh
            curl --version
            wget --version
            nmap --script-help http-title
            mtr --version
            speedtest --version
            htop --version
            btop --version
            bash --norc -c "source /usr/share/bash-completion/bash_completion; declare -F _init_completion"
          '
          container_id=$(docker run -d --network none doprax-service:check)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          test "$(docker inspect --format '{{.State.Running}}' "$container_id")" = true
          test "$(docker inspect --format '{{.Path}}' "$container_id")" = sleep
      - name: Publish validated image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
